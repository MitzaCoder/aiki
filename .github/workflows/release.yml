name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
    branches: ['ci/release-check']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Downloaded CFT binaries have no Ubuntu AppArmor user-namespace profile. These are trusted local fixtures only.
      CHROMIUM_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install pinned workspace tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/jj" "$RUNNER_TEMP/bin"
          gh release download v0.47.1 --repo jj-vcs/jj \
            --pattern jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP/jj"
          cd "$RUNNER_TEMP/jj"
          echo 'd4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7  jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz' | sha256sum --check
          tar -xzf jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz ./jj
          install -m 755 jj "$RUNNER_TEMP/bin/jj"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Cache pinned headless shell archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/aiki-headless-shell
          key: cft-linux64-157.0.8103.50-7bf0d41e424efd1d6281c4162993ab9dc5de92fac213c211614905a71c057d0f
      - name: Install pinned headless shell
        run: bash scripts/setup-test-browser.sh "$RUNNER_TOOL_CACHE/aiki-headless-shell" "$RUNNER_TEMP/aiki-headless-shell"
      - name: Report test toolchain
        run: |
          bun --version
          jj --version
          git --version
          date --version
          "$CHROMIUM_BIN" --version
      - run: bun install --frozen-lockfile
      - run: bun test && bun run typecheck
      - run: bun run check && bun run build && bun test
        working-directory: apps/web
      - run: bun apps/android/scripts/generate-protocol.ts --check
      - name: Install pinned public source scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/bin"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          install -m 755 gitleaks "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bun scripts/check-public.ts --public-ci
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build neutral source and web release
        run: bun scripts/build-release.ts --version "$GITHUB_REF_NAME" --out .preview/releases
      - name: Hash installer
        run: sha256sum install.sh > .preview/releases/install.sh.sha256
      - name: Stage draft tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --prerelease .preview/releases/* install.sh ;;
            *) gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes .preview/releases/* install.sh ;;
          esac
